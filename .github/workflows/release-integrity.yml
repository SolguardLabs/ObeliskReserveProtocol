name: Release integrity

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  verify-refs:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify stable refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main production
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/production)"
          tag_sha="$(git rev-parse 'refs/remotes/origin/release-tag^{}')"
          test "$main_sha" = "$production_sha"
          test "$main_sha" = "$tag_sha"
          if [[ "${{ github.event_name }}" = release ]]; then
            test "${{ github.event.release.name }}" = "Production 1.0.0"
          fi
          echo "Stable release: $main_sha"
